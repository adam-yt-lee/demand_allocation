<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>齊套料管理工具</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+TC:wght@300;400;500;700&display=swap');

  :root {
    --bg: #0f1117;
    --surface: #181c27;
    --surface2: #1e2333;
    --border: #2a3048;
    --border2: #3a4460;
    --text: #d4daf0;
    --text-dim: #6b7799;
    --text-muted: #3d4a6a;
    --accent: #4f7cff;
    --accent-dim: #1e2d5a;
    --green: #2dd4a0;
    --green-dim: #0d3326;
    --red: #ff5c72;
    --red-dim: #3d0d17;
    --yellow: #f5c842;
    --mono: 'IBM Plex Mono', monospace;
    --sans: 'IBM Plex Sans TC', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 13px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── HEADER ── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
    gap: 12px;
  }
  .logo { font-family: var(--mono); font-size: 14px; font-weight: 600; color: var(--accent); letter-spacing: .05em; white-space: nowrap; }
  .logo span { color: var(--text-dim); font-weight: 400; }
  .header-right { display: flex; align-items: center; gap: 10px; }
  .file-label {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 14px; background: var(--accent); color: #fff;
    border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: 500;
    transition: background .15s; white-space: nowrap; border: none;
  }
  .file-label:hover { background: #3d6aee; }
  .file-label input { display: none; }
  .btn-sec { background: var(--surface2); border: 1px solid var(--border2); color: var(--text-dim); }
  .btn-sec:hover { background: var(--border); color: var(--text); }
  .file-status { font-family: var(--mono); font-size: 11px; color: var(--text-dim); white-space: nowrap; max-width: 200px; overflow: hidden; text-overflow: ellipsis; }

  /* ── ERROR BAR ── */
  #error-bar { display: none; background: var(--red-dim); border-bottom: 1px solid var(--red); color: var(--red); padding: 6px 20px; font-size: 12px; font-family: var(--mono); flex-shrink: 0; }

  /* ── MAIN LAYOUT ── */
  .main { display: flex; flex: 1; overflow: hidden; }

  /* ── LEFT PANEL ── */
  .left-panel { flex: 1; display: flex; flex-direction: column; border-right: 1px solid var(--border); overflow: hidden; }
  .panel-header { padding: 10px 14px; border-bottom: 1px solid var(--border); font-size: 11px; font-family: var(--mono); color: var(--text-dim); display: flex; align-items: center; justify-content: space-between; background: var(--surface); flex-shrink: 0; }
  .panel-header-label { color: var(--text); font-weight: 600; font-size: 12px; }
  .card-list { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 3px; }

  /* ── MONTH GROUP ── */
  .month-group { margin-bottom: 2px; }
  .month-header { display: flex; align-items: center; gap: 6px; padding: 3px 8px; cursor: pointer; user-select: none; font-family: var(--mono); font-size: 10px; color: var(--text-dim); border-radius: 3px; transition: background .1s; }
  .month-header:hover { background: var(--surface2); }
  .month-header .mh-arrow { font-size: 9px; transition: transform .15s; }
  .month-header.collapsed .mh-arrow { transform: rotate(-90deg); }
  .month-header .mh-label { color: var(--accent); font-weight: 600; letter-spacing: .05em; }
  .month-header .mh-count { color: var(--text-muted); }
  .month-header .mh-ok { color: var(--green); }
  .month-header .mh-short { color: var(--red); margin-left: 4px; }
  .month-cards { display: flex; flex-direction: column; gap: 3px; padding: 0 0 4px 0; }
  .month-cards.collapsed { display: none; }

  /* ── DEMAND CARD ── */
  .demand-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    user-select: none;
    transition: border-color .15s, opacity .15s;
    border-left: 3px solid var(--border2);
    overflow: hidden;
  }
  .demand-card.dragging { opacity: 0.4; }
  .demand-card.drag-over { border-color: var(--accent); background: var(--accent-dim); }
  .demand-card.calc-ok    { border-left-color: var(--green); }
  .demand-card.calc-short { border-left-color: var(--red); }
  .demand-card.calc-unresolved { border-left-color: var(--yellow); }
  .demand-card.frozen { opacity: 0.5; }

  /* ── CARD HEADER ── */
  .card-header {
    display: flex; align-items: center; gap: 0;
    padding: 5px 8px 5px 0; min-height: 50px;
    cursor: grab;
  }
  .card-header:active { cursor: grabbing; }
  .card-checkbox { width: 14px; height: 14px; cursor: pointer; accent-color: var(--accent); flex-shrink: 0; margin: 0 4px 0 8px; }
  .card-expand { font-size: 9px; color: var(--text-muted); width: 14px; flex-shrink: 0; text-align: center; transition: transform .15s; pointer-events: none; }
  .demand-card.expanded .card-expand { transform: rotate(90deg); }
  .card-priority { font-family: var(--mono); font-size: 10px; color: var(--text-muted); width: 20px; flex-shrink: 0; text-align: right; margin-right: 6px; }
  .card-info { flex: 1; min-width: 0; margin-right: 6px; }
  .card-name { font-weight: 700; font-size: 11px; color: var(--text); line-height: 1.2; }
  .card-meta { font-size: 9px; color: var(--text-muted); line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-month-row { display: flex; align-items: center; gap: 3px; font-size: 9px; font-family: var(--mono); white-space: nowrap; flex-shrink: 0; margin-right: 6px; }
  .mth-label { color: var(--text-muted); }
  .mth-select { background: var(--surface2); border: 1px solid var(--border2); color: var(--accent); font-family: var(--mono); font-size: 9px; padding: 0 2px; border-radius: 2px; cursor: pointer; outline: none; max-width: 62px; }
  .mth-select:focus { border-color: var(--accent); }
  .card-status { font-size: 10px; font-family: var(--mono); flex-shrink: 0; text-align: right; min-width: 50px; }
  .status-ok    { color: var(--green); }
  .status-short { color: var(--red); }
  .status-unresolved { color: var(--yellow); }
  .status-frozen-txt { color: var(--text-muted); }

  /* ── CARD DETAIL (expandable) ── */
  .card-detail { display: none; border-top: 1px solid var(--border); padding: 6px 8px; cursor: default; user-select: text; }
  .demand-card.expanded .card-detail { display: block; }

  /* ── ITEMS TABLE ── */
  .items-table { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 11px; }
  .items-table th { text-align: left; color: var(--text-dim); font-size: 10px; font-weight: 600; padding: 2px 6px 4px; border-bottom: 1px solid var(--border); letter-spacing: .04em; white-space: nowrap; }
  .items-table th.r { text-align: right; }
  .items-table td { padding: 3px 6px; border-bottom: 1px solid rgba(212,218,240,.06); color: var(--text); vertical-align: middle; }
  .items-table tr:last-child td { border-bottom: none; }
  .items-table td.r { text-align: right; font-family: var(--mono); }
  .items-table td.group-cell { color: var(--text-dim); font-size: 10px; max-width: 100px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .name-select { background: var(--surface2); border: 1px solid var(--border); color: var(--text); font-family: var(--mono); font-size: 10px; padding: 2px 4px; border-radius: 2px; cursor: pointer; outline: none; width: 100%; max-width: 220px; }
  .name-select:focus { border-color: var(--accent); }
  .name-select.unselected { color: var(--text-muted); border-color: var(--border2); font-style: italic; }
  .gap-pos  { color: var(--green); }
  .gap-neg  { color: var(--red); }
  .gap-zero { color: var(--text-muted); }

  /* ── RIGHT PANEL ── */
  .right-panel { flex: 1; min-width: 280px; display: flex; flex-direction: column; overflow: hidden; }
  .right-top { padding: 8px 10px; border-bottom: 1px solid var(--border); background: var(--surface); flex-shrink: 0; }
  .summary-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .summary-card { background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; text-align: center; }
  .summary-num { font-family: var(--mono); font-size: 18px; font-weight: 600; line-height: 1; margin-bottom: 2px; }
  .summary-label { font-size: 10px; color: var(--text-dim); }
  .summary-card.ok .summary-num { color: var(--green); }
  .summary-card.short .summary-num { color: var(--red); }
  .summary-card.frozen-s .summary-num { color: var(--text-muted); }
  .summary-card.total .summary-num { color: var(--accent); }
  .right-bottom { flex: 1; overflow: hidden; display: flex; flex-direction: column; }
  .section-header { padding: 8px 16px; border-bottom: 1px solid var(--border); font-size: 11px; font-family: var(--mono); color: var(--text-dim); background: var(--surface); flex-shrink: 0; display: flex; align-items: center; gap: 8px; }
  .table-wrap { flex: 1; overflow-y: auto; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 11px; }
  thead th { position: sticky; top: 0; background: var(--surface2); color: var(--text-dim); font-weight: 600; font-size: 10px; padding: 4px 8px; text-align: right; border-bottom: 1px solid var(--border); white-space: nowrap; letter-spacing: .04em; }
  thead th:first-child, thead th:nth-child(2) { text-align: left; }
  tbody td { padding: 4px 8px; text-align: right; color: var(--text); border-bottom: 1px solid rgba(212,218,240,.1); font-size: 11px; }
  tbody tr:last-child td { border-bottom: none; }
  tbody td:first-child { text-align: left; color: var(--text-dim); font-size: 10px; }
  tbody td:nth-child(2) { text-align: left; color: var(--text); }
  .num-pos { color: var(--green); }
  .num-neg { color: var(--red); }
  .num-zero { color: var(--text-muted); }

  /* ── OPTIMIZE BUTTON ── */
  .btn-optimize {
    background: var(--accent-dim); border: 1px solid var(--accent); color: var(--accent);
    font-family: var(--mono); font-size: 10px; padding: 3px 10px; border-radius: 3px;
    cursor: pointer; transition: background .15s, color .15s; white-space: nowrap;
  }
  .btn-optimize:hover:not(:disabled) { background: var(--accent); color: #fff; }
  .btn-optimize:disabled { opacity: 0.5; cursor: not-allowed; }

  /* ── TOAST ── */
  #opt-toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--surface2); border: 1px solid var(--accent); color: var(--text);
    font-family: var(--mono); font-size: 12px; padding: 8px 18px; border-radius: 6px;
    z-index: 9999; opacity: 0; transition: opacity .3s; pointer-events: none;
  }

  /* ── EMPTY STATE ── */
  .empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: var(--text-muted); font-family: var(--mono); font-size: 12px; }

  /* scrollbar */
  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }
</style>
</head>
<body>

<header>
  <div class="logo">KIT<span>·</span>CHECK <span>// 齊套料管理</span></div>
  <div class="header-right">
    <div class="file-status" id="file-status">尚未載入檔案</div>
    <button class="file-label btn-sec" onclick="downloadTemplate()">↓ 下載範本</button>
    <button class="file-label btn-sec" id="dl-btn" style="display:none" onclick="downloadResult()">↓ 下載結果</button>
    <label class="file-label">
      ↑ 上傳 XLSX
      <input type="file" id="file-input" accept=".xlsx,.xls">
    </label>
  </div>
</header>

<div id="error-bar"></div>

<div class="main">
  <div class="left-panel">
    <div class="panel-header">
      <span class="panel-header-label">需求列表</span>
      <div style="display:flex;align-items:center;gap:10px;">
        <button id="optimize-btn" class="btn-optimize" onclick="autoOptimize()" title="Branch-and-Bound ILP：自動選 Name 並最大化可滿足需求數">⚡ 自動最佳化</button>
        <span id="card-count">— 筆</span>
      </div>
    </div>
    <div id="opt-toast"></div>
    <div class="card-list" id="card-list">
      <div class="empty-state">
        <div>📂</div>
        <div>上傳 XLSX 以載入需求</div>
      </div>
    </div>
  </div>

  <div class="right-panel">
    <div class="right-top">
      <div class="summary-grid">
        <div class="summary-card ok">
          <div class="summary-num" id="s-ok">—</div>
          <div class="summary-label">✅ 可滿足</div>
        </div>
        <div class="summary-card short">
          <div class="summary-num" id="s-short">—</div>
          <div class="summary-label">❌ 缺料</div>
        </div>
        <div class="summary-card frozen-s">
          <div class="summary-num" id="s-frozen">—</div>
          <div class="summary-label">凍結</div>
        </div>
        <div class="summary-card total">
          <div class="summary-num" id="s-total">—</div>
          <div class="summary-label">總需求數</div>
        </div>
      </div>
    </div>
    <div class="right-bottom">
      <div class="section-header"><span>供給剩餘</span> // 扣料後總表</div>
      <div class="table-wrap">
        <table id="stock-table">
          <thead><tr>
            <th>Group</th>
            <th>Name</th>
            <th>庫存</th>
            <th>進料</th>
            <th>剩餘庫存</th>
            <th>剩餘進料</th>
          </tr></thead>
          <tbody id="stock-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
// ─────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────
let demandMap      = {};  // { [key]: { month, items: [{ group, name, qty }] } }
let supplyRows     = [];  // [{ group, name, qty, month }]
let cardOrder      = [];
let cardChecked    = {};
let cardExpanded   = {};
let collapsedMonths = {};
let adoptedMonthMap = {};
let nameSelections  = {}; // { "DemandKey_idx": selectedName }

function getEffectiveName(key, idx) {
  const k = `${key}_${idx}`;
  if (nameSelections.hasOwnProperty(k)) return nameSelections[k];

  const item = demandMap[key].items[idx];
  const names = getNamesForGroup(item.group);
  if (names.length === 1) return names[0];

  return item.name || '';
}

function hasSupplyMatch(group, name) {
  if (!group || !name) return false;
  return supplyRows.some(r => r.group === group && r.name === name);
}

function getNamesForGroup(group) {
  const seen = new Set(), result = [];
  supplyRows.forEach(r => {
    if (r.group === group && !seen.has(r.name)) { seen.add(r.name); result.push(r.name); }
  });
  return result;
}

function getAdoptedMonth(key) {
  return adoptedMonthMap[key] !== undefined ? adoptedMonthMap[key] : demandMap[key].month;
}

function getMonthOptions(key) {
  const target = demandMap[key].month;
  const months = new Set([target]);
  supplyRows.forEach(r => { if (r.month !== 'STOCK') months.add(r.month); });
  return [...months].filter(m => m >= target).sort((a, b) => a - b);
}

// ─────────────────────────────────────────────
// FILE UPLOAD
// ─────────────────────────────────────────────
document.getElementById('file-input').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      parseWorkbook(XLSX.read(ev.target.result, { type: 'array' }), file.name);
    } catch(err) { showError('讀取 XLSX 失敗：' + err.message); }
  };
  reader.readAsArrayBuffer(file);
  e.target.value = '';
});

function parseWorkbook(wb, filename) {
  clearError();
  const lcNames = wb.SheetNames.map(s => s.toLowerCase());
  const missing = [];
  if (!lcNames.includes('demand')) missing.push('Demand');
  if (!lcNames.includes('supply')) missing.push('Supply');
  if (missing.length) { showError(`缺少 Sheet：${missing.join('、')}`); return; }

  const demandSheet = wb.Sheets[wb.SheetNames[lcNames.indexOf('demand')]];
  const supplySheet = wb.Sheets[wb.SheetNames[lcNames.indexOf('supply')]];
  const notBlank = obj => !Object.values(obj).every(v => String(v).trim() === '');
  const dRaws = XLSX.utils.sheet_to_json(demandSheet, { defval: '' }).filter(notBlank);
  const sRaws = XLSX.utils.sheet_to_json(supplySheet, { defval: '' }).filter(notBlank);

  // Case-insensitive column picker
  const pick = (obj, ...candidates) => {
    const keys = Object.keys(obj);
    for (const c of candidates) {
      const found = keys.find(k => k.trim().toLowerCase() === c.toLowerCase());
      if (found !== undefined) return String(obj[found]).trim();
    }
    return '';
  };

  const newDemandMap = {};
  dRaws.forEach(row => {
    const demand = pick(row, 'Demand');
    const group  = pick(row, 'Group', 'SPEC');
    const name   = pick(row, 'Name');
    const qty    = Number(pick(row, 'Qty'));
    const month  = Number(pick(row, 'Month'));
    if (!demand || !group || isNaN(qty) || isNaN(month)) return;
    if (!newDemandMap[demand]) newDemandMap[demand] = { month, items: [] };
    newDemandMap[demand].items.push({ group, name, qty });
  });

  const newSupplyRows = [];
  sRaws.forEach(row => {
    const group = pick(row, 'Group', 'SPEC');
    const name  = pick(row, 'Name');
    const qty   = Number(pick(row, 'Qty'));
    const mRaw  = pick(row, 'Month').toUpperCase();
    if (!group || isNaN(qty)) return;
    const month = (mRaw === 'STOCK' || mRaw === '') ? 'STOCK' : Number(pick(row, 'Month'));
    newSupplyRows.push({ group, name, qty, month });
  });

  demandMap       = newDemandMap;
  supplyRows      = newSupplyRows;
  nameSelections  = {};
  cardOrder       = Object.keys(newDemandMap).sort((a, b) => newDemandMap[a].month - newDemandMap[b].month);
  cardChecked     = {};
  cardExpanded    = {};
  collapsedMonths = {};
  adoptedMonthMap = {};
  cardOrder.forEach(k => { cardChecked[k] = true; cardExpanded[k] = false; });

  document.getElementById('file-status').textContent = filename;
  document.getElementById('dl-btn').style.display = '';
  renderAll();
}

// ─────────────────────────────────────────────
// CALCULATION ENGINE
// ─────────────────────────────────────────────
function calculate() {
  // Build supply pools keyed by name
  const stockPool   = {};
  const incomingPool = [];
  supplyRows.forEach(r => {
    if (r.month === 'STOCK') {
      stockPool[r.name] = (stockPool[r.name] || 0) + r.qty;
    } else {
      incomingPool.push({ group: r.group, name: r.name, qty: r.qty, month: r.month, remaining: r.qty });
    }
  });
  incomingPool.sort((a, b) => a.month - b.month);

  const results = {};

  for (const key of cardOrder) {
    const demand       = demandMap[key];
    const adoptedMonth = getAdoptedMonth(key);

    // Per-item availability using current pool state (before this demand deducts)
    const itemResults = demand.items.map((item, idx) => {
      const effectiveName = getEffectiveName(key, idx);
      if (effectiveName && !hasSupplyMatch(item.group, effectiveName)) {
        return { group: item.group, origName: item.name, effectiveName: '', qty: item.qty,
                 available: null, gap: null, itemStatus: 'ignored' };
      }
      if (!effectiveName) {
        return { group: item.group, origName: item.name, effectiveName: '', qty: item.qty,
                 available: null, gap: null, itemStatus: 'unresolved' };
      }
      const sAvail = stockPool[effectiveName] || 0;
      const iAvail = incomingPool
        .filter(r => r.name === effectiveName && r.month <= adoptedMonth)
        .reduce((s, r) => s + r.remaining, 0);
      const available = sAvail + iAvail;
      const gap = available - item.qty;
      return { group: item.group, origName: item.name, effectiveName, qty: item.qty,
               available, gap, itemStatus: gap >= 0 ? 'ok' : 'short' };
    });

    const hasUnresolved = itemResults.some(i => i.itemStatus === 'unresolved');
    const hasShort      = itemResults.some(i => i.itemStatus === 'short');
    const calcStatus    = hasUnresolved ? 'unresolved' : hasShort ? 'shortage' : 'ok';
    const deductStatus  = cardChecked[key] ? (calcStatus === 'ok' ? 'ok' : 'shortage') : 'frozen';

    results[key] = { status: deductStatus, calcStatus, items: itemResults };

    // Deduct supply only when checked AND fully satisfiable
    if (cardChecked[key] && calcStatus === 'ok') {
      for (const item of itemResults) {
        let toDeduct = item.qty;
        const fromStock = Math.min(toDeduct, stockPool[item.effectiveName] || 0);
        stockPool[item.effectiveName] = (stockPool[item.effectiveName] || 0) - fromStock;
        toDeduct -= fromStock;
        if (toDeduct > 0) {
          for (const r of incomingPool) {
            if (r.name !== item.effectiveName || r.month > adoptedMonth) continue;
            const take = Math.min(toDeduct, r.remaining);
            r.remaining -= take;
            toDeduct    -= take;
            if (toDeduct <= 0) break;
          }
        }
      }
    }
  }

  return { results, stockPool, incomingPool };
}

// ─────────────────────────────────────────────
// RENDER
// ─────────────────────────────────────────────
function renderAll() {
  const { results, stockPool, incomingPool } = calculate();
  renderCards(results);
  renderSummary(results);
  renderStockTable(stockPool, incomingPool);
}

// Event delegation for dropdowns inside cards
document.getElementById('card-list').addEventListener('change', e => {
  if (e.target.classList.contains('name-select')) {
    e.stopPropagation();
    nameSelections[`${e.target.dataset.key}_${e.target.dataset.idx}`] = e.target.value;
    renderAll();
  } else if (e.target.classList.contains('mth-select')) {
    e.stopPropagation();
    adoptedMonthMap[e.target.dataset.key] = Number(e.target.value);
    renderAll();
  }
});

function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderCards(results) {
  const list = document.getElementById('card-list');
  list.innerHTML = '';

  if (!cardOrder.length) {
    list.innerHTML = '<div class="empty-state"><div>📂</div><div>上傳 XLSX 以載入需求</div></div>';
    document.getElementById('card-count').textContent = '— 筆';
    return;
  }

  // Group by month
  const monthGroups = [], monthIndex = {};
  cardOrder.forEach(key => {
    const m = demandMap[key].month;
    if (monthIndex[m] === undefined) { monthIndex[m] = monthGroups.length; monthGroups.push({ month: m, keys: [] }); }
    monthGroups[monthIndex[m]].keys.push(key);
  });

  monthGroups.forEach(({ month, keys }) => {
    const isCollapsed = !!collapsedMonths[month];
    const okCount    = keys.filter(k => results[k].calcStatus === 'ok').length;
    const shortCount = keys.filter(k => results[k].calcStatus !== 'ok').length;

    const groupDiv = document.createElement('div');
    groupDiv.className = 'month-group';

    const hdr = document.createElement('div');
    hdr.className = 'month-header' + (isCollapsed ? ' collapsed' : '');
    hdr.innerHTML = `
      <span class="mh-arrow">▾</span>
      <span class="mh-label">${month}</span>
      <span class="mh-count">${keys.length}筆</span>
      ${okCount    > 0 ? `<span class="mh-ok">✓${okCount}</span>` : ''}
      ${shortCount > 0 ? `<span class="mh-short">✗${shortCount}</span>` : ''}
    `;
    hdr.onclick = () => { collapsedMonths[month] = !collapsedMonths[month]; renderAll(); };

    const cardsDiv = document.createElement('div');
    cardsDiv.className = 'month-cards' + (isCollapsed ? ' collapsed' : '');

    keys.forEach(key => {
      const result  = results[key];
      const checked = cardChecked[key];
      const expanded = cardExpanded[key];

      const calcClass = `calc-${result.calcStatus === 'ok' ? 'ok' : result.calcStatus === 'unresolved' ? 'unresolved' : 'short'}`;
      const card = document.createElement('div');
      card.className = `demand-card ${calcClass}${!checked ? ' frozen' : ''}${expanded ? ' expanded' : ''}`;

      // Adopted month dropdown
      const optMths = getMonthOptions(key);
      const adopted = getAdoptedMonth(key);
      if (!optMths.includes(adopted)) optMths.push(adopted);
      optMths.sort((a, b) => a - b);
      const mthOpts = optMths.map(m => `<option value="${m}"${m===adopted?' selected':''}>${m}</option>`).join('');

      // Status badge
      let statusHtml;
      if (!checked) {
        statusHtml = `<div class="card-status status-frozen-txt">—</div>`;
      } else if (result.status === 'ok') {
        statusHtml = `<div class="card-status status-ok">OK</div>`;
      } else if (result.calcStatus === 'unresolved') {
        statusHtml = `<div class="card-status status-unresolved">未完成</div>`;
      } else {
        statusHtml = `<div class="card-status status-short">缺料</div>`;
      }

      const unresCount = result.items.filter(i => i.itemStatus === 'unresolved').length;
      const ignoredCount = result.items.filter(i => i.itemStatus === 'ignored').length;
      const metaText = `${demandMap[key].items.length}項` +
        (unresCount > 0 ? ` · ${unresCount} 項未選 Name` : '') +
        (ignoredCount > 0 ? ` · ${ignoredCount} 項已忽略` : '');

      card.innerHTML = `
        <div class="card-header">
          <input type="checkbox" class="card-checkbox"${checked?' checked':''} data-key="${esc(key)}">
          <div class="card-expand">▶</div>
          <div class="card-priority">#${cardOrder.indexOf(key)+1}</div>
          <div class="card-info">
            <div class="card-name">${esc(key)}</div>
            <div class="card-meta">${metaText}</div>
          </div>
          <div class="card-month-row">
            <span class="mth-label">採用</span>
            <select class="mth-select" data-key="${esc(key)}">${mthOpts}</select>
          </div>
          ${statusHtml}
        </div>
        <div class="card-detail">
          ${buildDetailTable(key, result.items)}
        </div>
      `;

      // Checkbox handler
      card.querySelector('.card-checkbox').addEventListener('change', e => {
        e.stopPropagation();
        cardChecked[key] = e.target.checked;
        renderAll();
      });

      // Expand/collapse on header click (skip checkbox & month select)
      card.querySelector('.card-header').addEventListener('click', e => {
        if (e.target.closest('.card-checkbox') || e.target.closest('.mth-select')) return;
        cardExpanded[key] = !cardExpanded[key];
        card.classList.toggle('expanded', cardExpanded[key]);
      });

      // Prevent drag from starting when interacting with controls or detail
      card.querySelector('.card-detail').addEventListener('mousedown', e => e.stopPropagation());
      card.querySelector('.card-header').addEventListener('mousedown', e => {
        if (e.target.closest('.card-checkbox') || e.target.closest('.mth-select')) e.stopPropagation();
      });

      setupDrag(card, key);
      cardsDiv.appendChild(card);
    });

    groupDiv.appendChild(hdr);
    groupDiv.appendChild(cardsDiv);
    list.appendChild(groupDiv);
  });

  document.getElementById('card-count').textContent = `${cardOrder.length} 筆`;
}

function buildDetailTable(key, items) {
  const rows = items.map((item, idx) => {
    const names = getNamesForGroup(item.group);
    const effectiveName = getEffectiveName(key, idx);
    const isUnselected  = !effectiveName;
    const isIgnored = item.itemStatus === 'ignored';

    const options = ['', ...names].map(n =>
      `<option value="${esc(n)}"${n===effectiveName?' selected':''}>${n ? esc(n) : '-- 未選擇 --'}</option>`
    ).join('');

    let availTd, gapTd;
    if (isIgnored) {
      availTd = `<td class="r gap-zero">IGNORED</td>`;
      gapTd   = `<td class="r gap-zero">—</td>`;
    } else if (item.available === null) {
      availTd = `<td class="r gap-zero">—</td>`;
      gapTd   = `<td class="r gap-zero">—</td>`;
    } else {
      availTd = `<td class="r">${fmt(item.available)}</td>`;
      const gapClass = item.gap > 0 ? 'gap-pos' : item.gap < 0 ? 'gap-neg' : 'gap-zero';
      const gapStr   = item.gap >= 0 ? `+${fmt(item.gap)}` : fmt(item.gap);
      gapTd = `<td class="r ${gapClass}">${gapStr}</td>`;
    }

    return `<tr>
      <td class="group-cell" title="${esc(item.group)}">${esc(item.group)}</td>
      <td><select class="name-select${isUnselected?' unselected':''}" data-key="${esc(key)}" data-idx="${idx}" onmousedown="event.stopPropagation()">${options}</select></td>
      <td class="r">${fmt(item.qty)}</td>
      ${availTd}
      ${gapTd}
    </tr>`;
  }).join('');

  return `<table class="items-table">
    <thead><tr>
      <th>Group</th>
      <th>Name</th>
      <th class="r">需求</th>
      <th class="r">可用</th>
      <th class="r">缺口</th>
    </tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

function renderSummary(results) {
  let ok = 0, short = 0, frozen = 0;
  Object.values(results).forEach(r => {
    if (r.status === 'ok') ok++;
    else if (r.status === 'shortage') short++;
    else frozen++;
  });
  document.getElementById('s-ok').textContent    = ok;
  document.getElementById('s-short').textContent = short;
  document.getElementById('s-frozen').textContent = frozen;
  document.getElementById('s-total').textContent  = cardOrder.length;
}

function renderStockTable(stockPool, incomingPool) {
  const tbody = document.getElementById('stock-tbody');
  tbody.innerHTML = '';
  const seen = new Set();
  supplyRows.forEach(r => {
    if (seen.has(r.name)) return;
    seen.add(r.name);
    const sOrig = supplyRows.filter(s => s.name === r.name && s.month === 'STOCK').reduce((a, s) => a + s.qty, 0);
    const iOrig = supplyRows.filter(s => s.name === r.name && s.month !== 'STOCK').reduce((a, s) => a + s.qty, 0);
    const sRem  = stockPool[r.name] || 0;
    const iRem  = incomingPool.filter(s => s.name === r.name).reduce((a, s) => a + s.remaining, 0);
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${esc(r.group)}</td>
      <td>${esc(r.name)}</td>
      <td>${fmt(sOrig)}</td>
      <td>${fmt(iOrig)}</td>
      <td class="${numClass(sRem)}">${fmt(sRem)}</td>
      <td class="${numClass(iRem)}">${fmt(iRem)}</td>
    `;
    tbody.appendChild(tr);
  });
}

// DOWNLOAD — preserves original upload format
// ─────────────────────────────────────────────
function downloadResult() {
  const wb = XLSX.utils.book_new();

  // Demand sheet with effective names filled in
  const demandData = [['Demand', 'Group', 'Name', 'Qty', 'Month']];
  cardOrder.forEach(key => {
    const { month, items } = demandMap[key];
    items.forEach((item, idx) => {
      demandData.push([key, item.group, getEffectiveName(key, idx), item.qty, month]);
    });
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(demandData), 'Demand');

  // Supply sheet — unchanged
  const supplyData = [['Group', 'Name', 'Qty', 'Month']];
  supplyRows.forEach(r => {
    supplyData.push([r.group, r.name, r.qty, r.month === 'STOCK' ? 'Stock' : r.month]);
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(supplyData), 'Supply');

  XLSX.writeFile(wb, 'kit-check-result.xlsx');
}

function downloadTemplate() {
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([
    ['Demand', 'Group', 'Name', 'Qty', 'Month'],
    ['Demand1', 'DIMM 64G', '', 800, 202605],
    ['Demand1', 'AMD/9224', '', 100, 202605],
    ['Demand2', 'DIMM 128G', 'SAMSUNG/DDR5 128G/6400', 1200, 202606],
  ]), 'Demand');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([
    ['Group', 'Name', 'Qty', 'Month'],
    ['DIMM 64G', 'SAMSUNG/DDR5 64G/6400', 5000, 'Stock'],
    ['AMD/9224', 'AMD/9224', 200, 'Stock'],
    ['DIMM 128G', 'SAMSUNG/DDR5 128G/6400', 3000, 202606],
  ]), 'Supply');
  XLSX.writeFile(wb, 'kit-check-template.xlsx');
}

// ─────────────────────────────────────────────
// AUTO-OPTIMIZE  ── Branch-and-Bound ILP
//
// 問題建模：
//   決策變數  y_d ∈ {0,1}：第 d 筆需求是否被滿足
//             x_{d,i,n} ∈ {0,1}：第 d 筆需求第 i 項選 Name n
//   目標函數  最大化 Σ y_d
//   約束條件  ① 每個 (d,i) 恰好選一個 Name
//             ② 對每個 Name n、每個月份截止 m：
//                Σ_{d: month_d ≤ m, item uses n} qty * y_d ≤ supply[n][m]
//
// 演算法：以 y_d 為分支變數做 Branch-and-Bound；
//         子問題的 Name 指派以回溯搜索確定可行性。
// ─────────────────────────────────────────────
function autoOptimize() {
  if (!cardOrder.length) return;

  const btn = document.getElementById('optimize-btn');
  btn.disabled = true;
  btn.textContent = '運算中…';

  // Let the browser render the disabled state before blocking
  setTimeout(_runOptimize, 30);
}

function _runOptimize() {
  const btn = document.getElementById('optimize-btn');
  try {
    _solveAndApply();
  } finally {
    btn.disabled = false;
    btn.textContent = '⚡ 自動最佳化';
  }
}

function _solveAndApply() {
  // ── Build supply lookup ──────────────────────────────────────────
  const stockPool      = {};   // name → qty
  const incomingByName = {};   // name → [{qty, month}]  sorted asc

  for (const row of supplyRows) {
    if (row.month === 'STOCK') {
      stockPool[row.name] = (stockPool[row.name] || 0) + row.qty;
    } else {
      (incomingByName[row.name] = incomingByName[row.name] || [])
        .push({ qty: row.qty, month: row.month });
    }
  }
  for (const n in incomingByName)
    incomingByName[n].sort((a, b) => a.month - b.month);

  // Cumulative supply of `name` available up to `month`
  function supplyAt(name, month) {
    let t = stockPool[name] || 0;
    for (const inc of (incomingByName[name] || []))
      if (inc.month <= month) t += inc.qty;
    return t;
  }

  // ── Build demand list (all demands, ignore current cardChecked) ──
  const demandList = cardOrder.map(key => {
    const d     = demandMap[key];
    const month = getAdoptedMonth(key);
    const items = d.items.map((item, idx) => {
      const selKey    = `${key}_${idx}`;
      const fixedName = item.name || nameSelections[selKey] || '';
      const candidates = fixedName
        ? [fixedName]
        : getNamesForGroup(item.group).filter(n => n);
      return { selKey, candidates, qty: item.qty, month, isFixed: !!fixedName };
    });
    return { key, month, items };
  });

  // Sort by month ascending – tighter constraints first helps pruning
  demandList.sort((a, b) => a.month - b.month || a.key.localeCompare(b.key));

  const N = demandList.length;

  // ── Branch-and-Bound state ───────────────────────────────────────
  let bestCount      = 0;
  let bestSatisfied  = new Set();
  let bestAssignments = {};

  const t0      = Date.now();
  const LIMIT   = 10_000; // 10 s wall-clock limit
  let timedOut  = false;

  // consumed[name][month] = qty allocated to satisfied demands whose
  // adopted month === month.
  // consumedUpTo(name, m) = sum over all months mo ≤ m.
  // This correctly models the time-gated supply constraint:
  //   for each horizon m: cumulative demand ≤ cumulative supply.
  function consumedUpTo(cons, name, month) {
    const byM = cons[name];
    if (!byM) return 0;
    let s = 0;
    for (const mo in byM) if (+mo <= month) s += byM[mo];
    return s;
  }

  function copyCons(cons) {
    const c = {};
    for (const n in cons) c[n] = { ...cons[n] };
    return c;
  }

  // Try to assign a valid Name to every item of a demand.
  // Uses backtracking within the demand.  Returns {newCons, newAssign}
  // if feasible, or null.
  function tryAssign(items, cons) {
    const nc = copyCons(cons);
    const na = {};

    function bt(i) {
      if (i >= items.length) return true;
      const item = items[i];
      for (const name of item.candidates) {
        const avail = supplyAt(name, item.month)
                    - consumedUpTo(nc, name, item.month);
        if (avail >= item.qty) {
          if (!nc[name]) nc[name] = {};
          const prev = nc[name][item.month] || 0;
          nc[name][item.month] = prev + item.qty;
          if (!item.isFixed) na[item.selKey] = name;
          if (bt(i + 1)) return true;
          nc[name][item.month] = prev;
          if (!item.isFixed) delete na[item.selKey];
        }
      }
      return false;
    }

    return bt(0) ? { newCons: nc, newAssign: na } : null;
  }

  // Mutable set tracking the current branch's satisfied demands
  const curSatisfied = new Set();

  function bnb(idx, count, cons, assign) {
    if (timedOut) return;
    if (Date.now() - t0 > LIMIT) { timedOut = true; return; }

    // Record new best
    if (count > bestCount) {
      bestCount      = count;
      bestSatisfied  = new Set(curSatisfied);
      bestAssignments = { ...assign };
    }

    // Prune: even if all remaining demands are satisfied, can't beat best
    if (idx >= N || count + (N - idx) <= bestCount) return;

    const d = demandList[idx];

    // Branch 1 – include demand d (try to satisfy it)
    const r = tryAssign(d.items, cons);
    if (r) {
      curSatisfied.add(d.key);
      bnb(idx + 1, count + 1, r.newCons, { ...assign, ...r.newAssign });
      curSatisfied.delete(d.key);
    }

    // Branch 2 – exclude demand d
    bnb(idx + 1, count, cons, assign);
  }

  bnb(0, 0, {}, {});

  // ── Apply results ────────────────────────────────────────────────
  // 1. Name selections
  Object.assign(nameSelections, bestAssignments);

  // 2. Mark all demands active; optimal set comes first so that the
  //    sequential calculate() deducts in a month-safe order and
  //    correctly satisfies all demands in the optimal set.
  cardOrder.forEach(k => { cardChecked[k] = true; });

  const satArr  = [...bestSatisfied]
    .sort((a, b) => demandMap[a].month - demandMap[b].month);
  const restArr = cardOrder
    .filter(k => !bestSatisfied.has(k))
    .sort((a, b) => demandMap[a].month - demandMap[b].month);
  cardOrder = [...satArr, ...restArr];

  renderAll();

  // ── Show result toast ────────────────────────────────────────────
  const label = timedOut ? '最佳化（達時限，非最優解）' : '最佳解';
  showToast(`⚡ ${label}：可滿足 ${bestCount} / ${N} 筆需求`);
}

function showToast(msg) {
  const el = document.getElementById('opt-toast');
  el.textContent = msg;
  el.style.opacity = '1';
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.style.opacity = '0'; }, 5000);
}

// ─────────────────────────────────────────────
// DRAG & DROP
// ─────────────────────────────────────────────
let dragSrcKey = null;

function setupDrag(card, key) {
  card.draggable = true;
  card.ondragstart = e => {
    if (e.target.closest('.card-detail') || e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') {
      e.preventDefault(); return;
    }
    dragSrcKey = key;
    card.classList.add('dragging');
  };
  card.ondragend   = () => card.classList.remove('dragging');
  card.ondragover  = e => e.preventDefault();
  card.ondrop      = e => {
    e.preventDefault();
    if (dragSrcKey && dragSrcKey !== key) {
      const from = cardOrder.indexOf(dragSrcKey), to = cardOrder.indexOf(key);
      cardOrder.splice(from, 1);
      cardOrder.splice(to, 0, dragSrcKey);
      renderAll();
    }
  };
}

// ─────────────────────────────────────────────
// UTILS
// ─────────────────────────────────────────────
function fmt(n)        { return Number(n).toLocaleString(); }
function numClass(n)   { return n > 0 ? 'num-pos' : n < 0 ? 'num-neg' : 'num-zero'; }
function showError(msg){ const b = document.getElementById('error-bar'); b.textContent = msg; b.style.display = 'block'; }
function clearError()  { document.getElementById('error-bar').style.display = 'none'; }
