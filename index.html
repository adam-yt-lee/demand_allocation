<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>齊套料管理工具</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <div class="logo">KIT<span>·</span>CHECK <span>// 齊套料管理</span></div>
  <div class="header-right">
    <div class="file-status" id="file-status">尚未載入檔案</div>
    <button class="file-label btn-sec" onclick="downloadTemplate()">↓ 下載範本</button>
    <button class="file-label btn-sec" id="dl-btn" style="display:none" onclick="downloadResult()">↓ 下載結果</button>
    <label class="file-label">
      ↑ 上傳 XLSX
      <input type="file" id="file-input" accept=".xlsx,.xls">
    </label>
  </div>
</header>

<div id="error-bar"></div>

<div class="main">
  <div class="left-panel">
    <div class="panel-header">
      <span class="panel-header-label">需求列表</span>
      <div style="display:flex;align-items:center;gap:10px;">
        <button id="optimize-btn" class="btn-optimize" onclick="autoOptimize()" title="Branch-and-Bound ILP：自動選 Name 並最大化可滿足需求數">⚡ 自動最佳化</button>
        <span id="card-count">— 筆</span>
      </div>
    </div>
    <div id="opt-toast"></div>
    <div class="card-list" id="card-list">
      <div class="empty-state">
        <div>📂</div>
        <div>上傳 XLSX 以載入需求</div>
      </div>
    </div>
  </div>

  <div class="right-panel">
    <div class="right-top">
      <div class="summary-grid">
        <div class="summary-card ok">
          <div class="summary-num" id="s-ok">—</div>
          <div class="summary-label">✅ 可滿足</div>
        </div>
        <div class="summary-card short">
          <div class="summary-num" id="s-short">—</div>
          <div class="summary-label">❌ 缺料</div>
        </div>
        <div class="summary-card frozen-s">
          <div class="summary-num" id="s-frozen">—</div>
          <div class="summary-label">凍結</div>
        </div>
        <div class="summary-card total">
          <div class="summary-num" id="s-total">—</div>
          <div class="summary-label">總需求數</div>
        </div>
      </div>
    </div>
    <div class="right-bottom">
      <div class="section-header"><span>供給缺口</span> // 勾選需求總表</div>
      <div class="table-wrap">
        <table id="stock-table">
          <thead><tr>
            <th>Group</th>
            <th>Name</th>
            <th>庫存</th>
            <th>進料</th>
            <th>需求</th>
            <th>缺口</th>
          </tr></thead>
          <tbody id="stock-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script src="app.js" defer></script>
<script src="optimize.js" defer></script>
</body>
</html>
